# Builds the downloadable apps and attaches them to a GitHub release.
# Runs when a version tag is pushed:  git tag v1.0.1 && git push origin v1.0.1
#
# Each OS builds on its own runner because PyInstaller can't cross-compile:
# a Mac app has to be built on a Mac.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # manual run from the Actions tab: builds only, no release

permissions:
  contents: write  # needed to create the release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: PDF-Toolkit-Windows.exe
          - os: macos-latest  # Apple Silicon (M1 and newer)
            asset: PDF-Toolkit-macOS.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned to the versions the Windows build was tested with.
      - run: python -m pip install pyinstaller==6.22.3 pikepdf==10.18.2 pypdfium2==5.15.2 pillow==13.0.0 pillow-heif==1.8.1 tkinterdnd2==0.7.0

      - name: Build (Windows)
        if: runner.os == 'Windows'
        # One file, no console window. PyInstaller has hooks for pikepdf (qpdf) and pypdfium2 (PDFium);
        # tkinterdnd2 ships its own, which bundles its native drag-and-drop library.
        run: |
          pyinstaller --noconfirm --onefile --windowed --name PDF-Toolkit pdf_toolkit.py
          Move-Item dist/PDF-Toolkit.exe ${{ matrix.asset }}

      - name: Build (macOS)
        if: runner.os == 'macOS'
        # A .app bundle (one-dir: macOS apps are folders). ditto keeps the
        # permissions and code signature that a plain zip would lose.
        run: |
          pyinstaller --noconfirm --windowed --name "PDF Toolkit" pdf_toolkit.py
          ditto -c -k --keepParent "dist/PDF Toolkit.app" ${{ matrix.asset }}

      # Smoke test: the app must start and still be running after 20 s
      # (a missing module or library makes a frozen app quit at once).
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: |
          $p = Start-Process ./${{ matrix.asset }} -PassThru
          Start-Sleep 20
          if ($p.HasExited) { throw "App exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          # Makes, merges, compresses, stamps, encrypts and renders a PDF, and loads drag and drop, inside the packaged app.
          $t = Start-Process ./${{ matrix.asset }} -ArgumentList "--self-test" -PassThru -Wait
          if ($t.ExitCode -ne 0) { throw "Self-test failed with code $($t.ExitCode)" }
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          "dist/PDF Toolkit.app/Contents/MacOS/PDF Toolkit" &
          pid=$!
          sleep 20
          kill -0 $pid || { echo "App exited early"; exit 1; }
          kill $pid
          # Makes, merges, compresses, stamps, encrypts and renders a PDF, and loads drag and drop, inside the packaged app.
          "dist/PDF Toolkit.app/Contents/MacOS/PDF Toolkit" --self-test || { echo "Self-test failed with code $?"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" PDF-Toolkit-Windows.exe PDF-Toolkit-macOS.zip
          --repo "${{ github.repository }}" --title "PDF Toolkit ${{ github.ref_name }}" --generate-notes
